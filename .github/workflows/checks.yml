name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.cjs
      - run: python bulk_create.py --csv examples/sites.csv --validate-only
      - run: git diff --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1 detect-secrets==1.5.0
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Check for new secrets without contacting credential providers
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and exercise an isolated workspace
        run: python3 tools/check_container.py --image ztb-site-automation:ci
